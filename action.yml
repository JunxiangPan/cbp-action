name: Cyber Butler Pipeline
description: Recompute coverage, dependency, documentation, binary, comment, and release-claim gates.
inputs:
  root:
    description: Repository root
    default: "."
  config:
    description: Optional CBP JSON/TOML config path (defaults to root/cbp.json)
    default: ""
  coverage-json:
    description: Path to coverage.py JSON output
    default: ""
  coverage-allowlist:
    description: Path to the coverage allowlist JSON
    default: ""
  coverage-signature:
    description: Optional coverage.json SHA256 sidecar
    default: ""
  require-coverage-signature:
    description: Require the coverage sidecar to match
    default: "false"
  coverage-threshold:
    description: Minimum allowlisted measured coverage
    default: "80"
  policy-coverage-threshold:
    description: Minimum policy coverage
    default: "85"
  dependency-lock:
    description: Hash-locked requirements file
    default: ""
  install-command:
    description: Installer file that must contain --require-hashes
    default: ""
  installer-core:
    description: Deprecated alias for install-command (accepted through v0.2.x)
    default: ""
  docs-manifest:
    description: Incident-history manifest
    default: ""
  binary-artifacts:
    description: Directory containing .build.json and .sbom.json
    default: ""
  package-zip:
    description: Optional release ZIP to scan instead of the repository
    default: ""
  claims-manifest:
    description: quality-manifest.json used by the claims gate
    default: ""
  claims-notes:
    description: generated release notes checked by the claims gate
    default: ""
  release-body:
    description: checked-in release body validated by the claims gate
    default: ""
  sarif-output:
    description: optional SARIF 2.1.0 output path
    default: ""
  baseline:
    description: optional baseline JSON path
    default: ""
  enable-coverage:
    default: "true"
  enable-encoding:
    default: "true"
  enable-dependency:
    default: "true"
  enable-comments:
    default: "true"
  enable-docs:
    default: "true"
  enable-binary:
    default: "true"
  enable-claims:
    default: "true"
  enable-custom:
    description: enable config-driven custom rules
    default: "true"
  enable-upgrade:
    description: enable config-driven upgrade checks
    default: "true"
  mode:
    description: audit logs failures but exits zero; enforce exits non-zero
    default: "enforce"
outputs:
  result:
    description: PASS or FAIL
    value: ${{ steps.cbp.outputs.result }}
runs:
  using: composite
  steps:
    - id: cbp
      shell: bash
      env:
        CBP_ROOT: ${{ inputs.root }}
        CBP_CONFIG: ${{ inputs.config }}
        CBP_COVERAGE_JSON: ${{ inputs.coverage-json }}
        CBP_COVERAGE_ALLOWLIST: ${{ inputs.coverage-allowlist }}
        CBP_COVERAGE_SIGNATURE: ${{ inputs.coverage-signature }}
        CBP_REQUIRE_COVERAGE_SIGNATURE: ${{ inputs.require-coverage-signature }}
        CBP_COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        CBP_POLICY_COVERAGE_THRESHOLD: ${{ inputs.policy-coverage-threshold }}
        CBP_DEPENDENCY_LOCK: ${{ inputs.dependency-lock }}
        CBP_INSTALL_COMMAND: ${{ inputs.install-command || inputs.installer-core }}
        CBP_DOCS_MANIFEST: ${{ inputs.docs-manifest }}
        CBP_BINARY_ARTIFACTS: ${{ inputs.binary-artifacts }}
        CBP_PACKAGE_ZIP: ${{ inputs.package-zip }}
        CBP_CLAIMS_MANIFEST: ${{ inputs.claims-manifest }}
        CBP_CLAIMS_NOTES: ${{ inputs.claims-notes }}
        CBP_RELEASE_BODY: ${{ inputs.release-body }}
        CBP_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        CBP_BASELINE: ${{ inputs.baseline }}
        CBP_ENABLE_COVERAGE: ${{ inputs.enable-coverage }}
        CBP_ENABLE_ENCODING: ${{ inputs.enable-encoding }}
        CBP_ENABLE_DEPENDENCY: ${{ inputs.enable-dependency }}
        CBP_ENABLE_COMMENTS: ${{ inputs.enable-comments }}
        CBP_ENABLE_DOCS: ${{ inputs.enable-docs }}
        CBP_ENABLE_BINARY: ${{ inputs.enable-binary }}
        CBP_ENABLE_CLAIMS: ${{ inputs.enable-claims }}
        CBP_ENABLE_CUSTOM: ${{ inputs.enable-custom }}
        CBP_ENABLE_UPGRADE: ${{ inputs.enable-upgrade }}
        CBP_MODE: ${{ inputs.mode }}
      run: |
        cd "${GITHUB_ACTION_PATH:?missing action path}"
        sha256sum -c dist/WHEEL_SHA256
        python -m pip install --no-deps "dist/cbp_action-1.0.8-py3-none-any.whl" >/dev/null
        set +e
        OUTPUT=$(python -m cbp.cli \
          --root "$CBP_ROOT" \
          --config "$CBP_CONFIG" \
          --coverage-json "$CBP_COVERAGE_JSON" \
          --coverage-allowlist "$CBP_COVERAGE_ALLOWLIST" \
          --coverage-signature "$CBP_COVERAGE_SIGNATURE" \
          --require-coverage-signature "$CBP_REQUIRE_COVERAGE_SIGNATURE" \
          --coverage-threshold "$CBP_COVERAGE_THRESHOLD" \
          --policy-coverage-threshold "$CBP_POLICY_COVERAGE_THRESHOLD" \
          --dependency-lock "$CBP_DEPENDENCY_LOCK" \
          --install-command "$CBP_INSTALL_COMMAND" \
          --docs-manifest "$CBP_DOCS_MANIFEST" \
          --binary-artifacts "$CBP_BINARY_ARTIFACTS" \
          --package-zip "$CBP_PACKAGE_ZIP" \
          --claims-manifest "$CBP_CLAIMS_MANIFEST" \
          --claims-notes "$CBP_CLAIMS_NOTES" \
          --release-body "$CBP_RELEASE_BODY" \
          --sarif-output "$CBP_SARIF_OUTPUT" \
          --baseline "$CBP_BASELINE" \
          --enable-coverage "$CBP_ENABLE_COVERAGE" \
          --enable-encoding "$CBP_ENABLE_ENCODING" \
          --enable-dependency "$CBP_ENABLE_DEPENDENCY" \
          --enable-comments "$CBP_ENABLE_COMMENTS" \
          --enable-docs "$CBP_ENABLE_DOCS" \
          --enable-binary "$CBP_ENABLE_BINARY" \
          --enable-claims "$CBP_ENABLE_CLAIMS" \
          --enable-custom "$CBP_ENABLE_CUSTOM" \
          --enable-upgrade "$CBP_ENABLE_UPGRADE" \
          --mode "$CBP_MODE" 2>&1)
        CODE=$?
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -E '^CBP_RESULT=' | tail -1 >> "$GITHUB_OUTPUT"
        exit $CODE

branding:
  icon: shield
  color: blue
